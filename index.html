<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sotuv Sayti — O'zbekistondagi qulay onlayn savdo maydonchasi</title>
  <meta name="description"
    content="Sotuv Sayti — elektronika, kiyim, uy jihozlari va boshqa minglab mahsulotlarni qulay narxlarda xarid qiling.">
  <script>(function(){try{if(localStorage.getItem("ss_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
  <link rel="icon" type="icon" href="./images/icons/icon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <!-- header -->
  <div id="header-mount"></div>

  <main class="container">

    <!-- hero banner -->
    <div id="hero-mount"></div>

    <!-- kategoriyalar -->
    <section class="section">
      <div class="section__head">
        <div>
          <span class="section__eyebrow" id="cat-section-eyebrow">Bo'limlar</span>
          <h2 class="section__title" id="cat-section-title">Kategoriya bo'yicha xarid qiling</h2>
        </div>
      </div>
      <div class="category-grid" id="cat-grid-mount"></div>
    </section>
    <!-- /kategoriyalar -->

    <!-- promo bannerlar (admin panel orqali boshqariladi) -->
    <section class="section">
      <div id="promo-banners-mount"></div>
    </section>
    <!-- /promo bannerlar -->

    <!-- chegirmadagi mahsulotlar -->
    <section class="section">
      <div class="section__head">
        <div>
          <span class="section__eyebrow" id="deals-eyebrow">Chegirmadagi mahsulotlar</span>
          <h2 class="section__title" id="deals-title">🔥 Kunning aksiyalari</h2>
        </div>
        <a href="catalog.html?sale=1" class="section__link" id="deals-view-all">Barchasini ko'rish →</a>
      </div>
      <div id="deals-mount"></div>
    </section>
    <!-- /chegirmadagi mahsulotlar -->

    <!-- yangi mahsulotlar -->
    <section class="section">
      <div class="section__head">
        <div>
          <span class="section__eyebrow" id="new-eyebrow">Yangi kelganlar</span>
          <h2 class="section__title" id="new-title">✨ Yangi mahsulotlar</h2>
        </div>
        <a href="catalog.html" class="section__link" id="new-view-all">Barchasini ko'rish →</a>
      </div>
      <div id="new-mount"></div>
    </section>
    <!-- /yangi mahsulotlar -->

    <!-- top baholangan mahsulotlar -->
    <section class="section">
      <div class="section__head">
        <div>
          <span class="section__eyebrow" id="top-eyebrow">Xaridorlar tanlovi</span>
          <h2 class="section__title" id="top-title">⭐ Yuqori baholangan mahsulotlar</h2>
        </div>
        <a href="catalog.html" class="section__link" id="top-view-all">Barchasini ko'rish →</a>
      </div>
      <div id="top-mount"></div>
    </section>
    <!-- /top baholangan mahsulotlar -->

  </main>

  <!-- footer -->
  <div id="footer-mount"></div>

  <!-- skriptlar -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang-links.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/main.js"></script>
  <script src="js/popups.js"></script>
  <script src="js/home.js"></script>
</body>

</html>
